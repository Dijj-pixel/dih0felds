<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felds — Carregando...</title>
    <style>
        /* ============================================
               PALETA DE CORES PRINCIPAL DO SISTEMA FELDS
               ============================================ */
        :root {
            /* Cor principal de fundo (creme suave) */
            --bg-main: #FFF8DC;
            /* Cor de destaque (laranja) */
            --accent: #FFA500;
            /* Cor para pequenos detalhes (marrom escuro) */
            --text-dark: #1d150b;
            /* Cor branca para elementos de destaque */
            --white: #FFFFFF;
            /* Transição suave para animações */
            --transition: 0.3s ease;
        }

        /* ============================================
               RESET GLOBAL E CONFIGURAÇÕES BÁSICAS
               ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-main);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            /* Mantém o cursor como pointer para indicar interatividade */
            cursor: default;
            user-select: none;
            /* Impede seleção de texto durante a splash */
            overflow: hidden;
            /* Remove qualquer barra de rolagem */
        }

        /* ============================================
               CONTAINER PRINCIPAL DA SPLASH SCREEN
               ============================================ */
        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            /* Espaçamento entre logo e nome */
            animation: fadeInScale 1.2s ease-out;
            /* Animação de entrada */
        }

        /* ============================================
               LOGOTIPO — ÍCONE PRINCIPAL
               ============================================ */
        .logo-icon {
            font-size: 8rem;
            /* Tamanho grande para impacto visual */
            line-height: 1;
            /* Remove espaçamento extra */
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s ease-in-out infinite;
            /* Animação sutil de pulsação */
            filter: drop-shadow(0 4px 12px rgba(255, 165, 0, 0.3));
            /* Sombra suave laranja */
        }

        /* ============================================
               NOME "FELDS" — TEXTO PRINCIPAL
               ============================================ */
        .logo-name {
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--text-dark);
            text-align: center;
            position: relative;
            display: inline-block;
        }

        /* Linha decorativa laranja abaixo do nome */
        .logo-name::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 4px;
            background: var(--accent);
            border-radius: 2px;
            animation: expandLine 2.5s ease-out forwards;
            /* Anima a linha se expandindo */
        }

        /* ============================================
               INDICADOR DE CARREGAMENTO (OPCIONAL)
               ============================================ */
        .loading-dots {
            display: flex;
            gap: 8px;
            margin-top: 30px;
            animation: fadeIn 2s ease-out;
        }

        .loading-dots span {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            animation: bounce 1.4s ease-in-out infinite;
        }

        /* Delay escalonado para cada bolinha */
        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* ============================================
               ANIMAÇÕES KEYFRAMES
               ============================================ */

        /* Animação de entrada — aparece suavemente com leve zoom */
        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Animação sutil de pulsação no ícone */
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        /* Animação das bolinhas de carregamento */
        @keyframes bounce {
            0%, 80%, 100% {
                transform: translateY(0);
                opacity: 0.6;
            }
            40% {
                transform: translateY(-15px);
                opacity: 1;
            }
        }

        /* Animação da linha decorativa */
        @keyframes expandLine {
            0% {
                width: 0%;
                opacity: 0;
            }
            100% {
                width: 60%;
                opacity: 1;
            }
        }

        /* Fade in simples */
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        /* ============================================
               RESPONSIVIDADE PARA TELAS MENORES
               ============================================ */
        @media (max-width: 600px) {
            .logo-icon {
                font-size: 5rem;
                /* Reduz o ícone em telas pequenas */
            }

            .logo-name {
                font-size: 3rem;
                /* Reduz o nome em telas pequenas */
            }

            .loading-dots span {
                width: 10px;
                height: 10px;
            }
        }

        @media (max-width: 400px) {
            .logo-icon {
                font-size: 4rem;
            }

            .logo-name {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================
    CONTEÚDO PRINCIPAL DA SPLASH SCREEN
    ============================================ -->
    <div class="splash-container">
        <!-- Ícone do logotipo (garfo e faca) -->
        <div class="logo-icon">🍽️</div>

        <!-- Nome da marca "Felds" -->
        <h1 class="logo-name">Felds</h1>

        <!-- Indicador de carregamento com três bolinhas animadas -->
        <div class="loading-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- ============================================
    SCRIPT DE REDIRECIONAMENTO AUTOMÁTICO
    ============================================ -->
    <script>
        // Aguarda o carregamento completo da página
        window.addEventListener('DOMContentLoaded', function() {
            // Define o tempo de espera de 3 segundos (3000 milissegundos)
            const REDIRECT_DELAY = 3000; // 3 segundos

            // Define o destino do redirecionamento
            const REDIRECT_URL = './pass.html'; // Página de login/senha

            // Exibe uma mensagem no console para facilitar o debug
            console.log('🍽️ Felds — Splash Screen carregada');
            console.log(`⏱️ Redirecionando para "${REDIRECT_URL}" em ${REDIRECT_DELAY / 1000} segundos...`);

            // Executa o redirecionamento após o tempo definido
            setTimeout(function() {
                // Redireciona o navegador para a página de senha
                window.location.href = REDIRECT_URL;
            }, REDIRECT_DELAY);
        });
    </script>

</body>
</html>
