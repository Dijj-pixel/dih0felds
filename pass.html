<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema Felds</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FFA500;
            font-family: 'EB Garamond', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .password-container {
            background: white;
            border-radius: 20px;
            padding: clamp(30px, 5vw, 50px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 450px;
            width: 100%;
            border: 3px solid black;
        }

        .password-container h1 {
            color: black;
            font-family: 'EB Garamond', serif;
            font-size: clamp(1.5rem, 3vw, 2rem);
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .password-container h1 span {
            font-style: italic;
            color: black;
            display: block;
            font-size: clamp(1rem, 2vw, 1.3rem);
            margin-top: 5px;
            font-weight: 400;
        }

        .input-wrapper {
            position: relative;
            margin: 25px 0;
        }

        #password-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1rem;
            border: 2px solid black;
            border-radius: 10px;
            background: white;
            color: black;
            font-family: 'Courier Prime', monospace;
            letter-spacing: 2px;
            outline: none;
            transition: all 0.3s ease;
        }

        #password-input::placeholder {
            font-family: 'Courier Prime', monospace;
            color: #666;
            letter-spacing: 1px;
        }

        #password-input:focus {
            border-color: #FFA500;
            box-shadow: 0 0 0 3px rgba(255, 165, 0, 0.3);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: black;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-family: 'EB Garamond', serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .submit-btn:hover {
            background: #333;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .error-message {
            color: #FF0000;
            margin-top: 15px;
            font-size: 0.9rem;
            min-height: 20px;
            font-family: 'EB Garamond', serif;
            font-weight: 500;
        }

        /* Responsividade adicional */
        @media (max-width: 480px) {
            .password-container {
                padding: 25px;
                border-radius: 15px;
            }

            #password-input,
            .submit-btn {
                font-size: 1rem;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="password-container">
        <h1>
            Acesso ao sistema felds
            <span>por: Diego</span>
        </h1>

        <div class="input-wrapper">
            <input 
                type="password" 
                id="password-input" 
                placeholder="Digite a senha de acesso"
                onkeypress="if(event.key === 'Enter') verificarSenha()"
            >
        </div>

        <button class="submit-btn" onclick="verificarSenha()">
            Acessar Sistema
        </button>

        <div id="error-message" class="error-message"></div>
    </div>

    <script>
        // ========================================
        // CONFIGURAÇÃO DA SENHA
        // Altere o valor abaixo para mudar a senha
        // ========================================
        const SENHA_CORRETA = "diegodomine";
        
        // ========================================
        // PÁGINA DE DESTINO
        // Altere o valor abaixo para mudar a página de destino
        // ========================================
        const PAGINA_DESTINO = "dashboard.html"; // ou "https://seusite.com/pagina-secreta"

        function verificarSenha() {
            const senhaDigitada = document.getElementById('password-input').value;
            const errorDiv = document.getElementById('error-message');
            
            if (senhaDigitada === SENHA_CORRETA) {
                errorDiv.textContent = "Acesso autorizado! Redirecionando...";
                errorDiv.style.color = "#00AA00";
                
                // Redireciona após 1 segundo
                setTimeout(() => {
                    window.location.href = PAGINA_DESTINO;
                }, 1000);
                
            } else {
                errorDiv.textContent = "Senha incorreta. Tente novamente.";
                errorDiv.style.color = "#FF0000";
                
                // Limpa o campo de senha
                document.getElementById('password-input').value = '';
                
                // Foca novamente no input
                document.getElementById('password-input').focus();
            }
        }

        // Limpa a mensagem de erro quando o usuário começa a digitar
        document.getElementById('password-input').addEventListener('input', function() {
            document.getElementById('error-message').textContent = '';
        });
    </script>
</body>
</html>
